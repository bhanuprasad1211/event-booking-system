version: '3.9'

services:

  web:
    build: .
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000

    volumes:
      - .:/app

    ports:
      - "8000:8000"

    depends_on:
      - db
      - redis

  db:
    image: postgres:15

    environment:
      POSTGRES_DB: event_booking
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: @stoic123!?

  redis:
    image: redis:7